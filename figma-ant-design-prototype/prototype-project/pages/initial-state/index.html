<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初始化状态模板</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: #1f2329;
        background: #f5f6f7;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 960px; }
      button { font: inherit; }

      .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .topbar {
        height: 56px; display: flex; align-items: center; padding: 0 28px;
        color: #fff; background: #1677ff; box-shadow: 0 1px 4px rgb(0 0 0 / 12%);
      }
      .brand { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
      .topbar-meta { margin-left: auto; font-size: 13px; opacity: .86; }

      .body { flex: 1; display: flex; }
      .sidebar {
        width: 216px; padding: 22px 14px; background: #fff;
        border-right: 1px solid #e5e6eb;
      }
      .sidebar-label { padding: 0 12px 10px; color: #86909c; font-size: 12px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
        border: 0; border-radius: 6px; color: #4e5969; background: transparent;
        text-align: left; cursor: default;
      }
      .nav-item.active { color: #1677ff; background: #e8f3ff; font-weight: 600; }
      .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

      .main { flex: 1; padding: 34px 42px; }
      .breadcrumb { color: #86909c; font-size: 13px; }
      .content-card {
        max-width: 920px; min-height: 540px; margin-top: 18px; padding: 76px 40px;
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: #fff; border: 1px solid #e5e6eb; border-radius: 10px;
      }
      .empty { max-width: 470px; }
      .empty-icon {
        width: 72px; height: 72px; margin: 0 auto 22px; display: grid; place-items: center;
        color: #1677ff; background: #e8f3ff; border-radius: 50%; font-size: 30px;
      }
      h1 { margin: 0; font-size: 26px; line-height: 1.35; }
      .description { margin: 14px 0 28px; color: #86909c; font-size: 14px; line-height: 1.8; }
      .actions { display: flex; justify-content: center; gap: 12px; }
      .button { padding: 9px 18px; border: 1px solid #d9dfe8; border-radius: 6px; color: #4e5969; background: #fff; }
      .button.primary { color: #fff; border-color: #1677ff; background: #1677ff; }
      .hint { margin-top: 28px; color: #c9cdd4; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">后台原型模板</div>
        <div class="topbar-meta">初始化状态 · Demo</div>
      </header>
      <div class="body">
        <aside class="sidebar">
          <div class="sidebar-label">原型页面</div>
          <button class="nav-item active"><span class="nav-dot"></span>初始化状态</button>
        </aside>
        <main class="main">
          <div class="breadcrumb">原型页面 / 初始化状态</div>
          <section class="content-card" aria-label="初始化状态">
            <div class="empty">
              <div class="empty-icon">＋</div>
              <h1>开始创建你的第一个页面</h1>
              <p class="description">
                这是 prototype-design 的初始化状态模板。将业务页面替换到此处后，保留导航、页面说明和空态结构即可快速形成可浏览原型。
              </p>
              <div class="actions">
                <button class="button primary">创建页面</button>
                <button class="button">查看使用说明</button>
              </div>
              <div class="hint">当前为静态展示，按钮暂不连接业务逻辑</div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
