<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PRD 原型查看器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 加载顺序：vue → nav.js → viewer.js；所有 viewer 端 CSS 已抽到 viewer.css（viewer 不依赖 element-plus） -->
  <link rel="stylesheet" href="assets/viewer.css" />
  <script src="assets/vue.global.prod.js"></script>
</head>
<body>
  <!-- 三栏查看器根节点；所有自定义样式都加 .viewer 前缀，与业务页 / desc 页隔离 -->
  <div id="app" class="viewer">
    <div class="layout" :class="{ 'left-collapsed': leftCollapsed, 'center-collapsed': centerCollapsed, 'right-collapsed': rightCollapsed }" :style="{ gridTemplateColumns: gridCols }">
      <div class="topbar">
        <div class="title">{{ projectName }}</div>
        <span class="meta" v-if="currentNode && currentNode.htmlPath">/{{ currentNode.htmlPath }}</span>
        <span class="badge" v-if="currentNode && currentNode.templateType">{{ currentNode.templateType }}</span>
        <div class="spacer"></div>
        <span class="meta" v-if="lastSyncAt">nav.js 同步于 {{ lastSyncAt }}</span>
        <div class="topbar-actions">
          <!-- 三个线框图标按钮：默认主题色（面板显示），.active 灰色（面板隐藏）。 -->
          <button class="icon-btn" :class="{ active: leftCollapsed }" @click="leftCollapsed = !leftCollapsed" :title="leftCollapsed ? '显示左侧' : '隐藏左侧'" :aria-label="leftCollapsed ? '显示左侧' : '隐藏左侧'">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="14" height="12" rx="1.5"/>
              <line x1="6.5" y1="4" x2="6.5" y2="16" stroke-width="2"/>
            </svg>
          </button>
          <button class="icon-btn" :class="{ active: centerCollapsed }" @click="centerCollapsed = !centerCollapsed" :title="centerCollapsed ? '显示中间' : '隐藏中间'" :aria-label="centerCollapsed ? '显示中间' : '隐藏中间'">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="14" height="12" rx="1.5"/>
              <line x1="10" y1="4" x2="10" y2="16" stroke-width="2"/>
            </svg>
          </button>
          <button class="icon-btn" :class="{ active: rightCollapsed }" @click="rightCollapsed = !rightCollapsed" :title="rightCollapsed ? '显示右侧' : '隐藏右侧'" :aria-label="rightCollapsed ? '显示右侧' : '隐藏右侧'">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="14" height="12" rx="1.5"/>
              <line x1="13.5" y1="4" x2="13.5" y2="16" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="panel left">
        <div class="panel-header">
          <span>目录</span>
          <div class="actions">
            <button @click="toggleAll">{{ allExpanded ? '全部折叠' : '全部展开' }}</button>
          </div>
        </div>
        <!-- 头部固定搜索栏：模糊匹配页面名称，展示匹配页面及其祖先链 -->
        <div class="search-bar">
          <input v-model="searchKeyword" type="text" placeholder="搜索页面名称" aria-label="搜索页面名称" />
          <span v-if="searchKeyword" class="search-clear" @click="searchKeyword = ''" :title="'清空'" :aria-label="'清空搜索'">×</span>
        </div>
        <div class="tree">
          <tree-node v-for="node in filteredTree" :key="node.id" :node="node" :depth="0" :active-id="activeId" @select="onSelectNode"></tree-node>
          <div v-if="searchKeyword && !filteredTree.length" class="tree-empty">未找到匹配的页面</div>
        </div>
      </div>
      <div class="divider" @pointerdown.prevent="startDrag('left', $event)"></div>
      <div class="panel center">
        <div class="iframe-wrap" :class="{ mobile: effectiveDevice === 'mobile' }">
          <div class="frame-inner">
            <iframe v-if="currentNode && currentNode.htmlPath" :src="currentNode.htmlPath"></iframe>
            <div v-else class="desc-empty">请在左侧选择一个页面</div>
          </div>
        </div>
      </div>
      <div class="divider" @pointerdown.prevent="startDrag('right', $event)"></div>
      <div class="panel right">
        <div class="panel-header">
          <span>文档</span>
          <div class="actions">
            <!-- 大纲切换按钮（viewer 端 source of truth）：点击 → 本地 tocVisible 翻转 + applyTocExtra 调栏宽 + postMessage 通知 desc iframe 切 toc-collapsed。 -->
            <button class="desc-toc-toggle" :class="{ active: !tocVisible }" @click="toggleToc" :title="tocVisible ? '隐藏大纲' : '显示大纲'" :aria-label="tocVisible ? '隐藏大纲' : '显示大纲'">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="14" height="12" rx="1.5"/>
                <line x1="5.5" y1="7.5" x2="9" y2="7.5"/>
                <line x1="5.5" y1="10" x2="9" y2="10"/>
                <line x1="5.5" y1="12.5" x2="9" y2="12.5"/>
                <line x1="13.5" y1="4" x2="13.5" y2="16" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="desc-body" v-if="currentNode && currentNode.mdPath">
          <!-- @load 在 iframe 重新加载（含切换页面）后同步大纲显示状态，避免状态被重置 -->
          <iframe :src="`desc/${currentNode.id}.html`" @load="onDescLoad"></iframe>
        </div>
        <div v-else class="desc-empty">{{ currentNode ? '该节点没有描述文档' : '请在左侧选择一个页面' }}</div>
      </div>
    </div>
  </div>

  <!-- viewer 端所有 JS 已抽到 viewer.js（按 assets/viewer.js）。脚本必须在 nav.js 之后加载，否则 window.NAV_DATA 还未注入。 -->
  <script src="nav.js"></script>
  <script src="assets/viewer.js"></script>
</body>
</html>
