  component: dialog-drawer.html
  历史用途: 弹窗/抽屉片段（snippet）
  当前状态: 不再使用。弹窗单选/多选（公司/门店）见 templates/pc/list.html 的
            el-dialog + el-checkbox-group 段；抽屉筛选见 templates/pc/list.html 的
            el-drawer 段。
-->
<!-- 弹窗 -->
<el-dialog v-model="dialog.visible" :title="dialog.title" width="520px">
  <el-form :model="dialog.form" label-width="80px">
    <el-form-item label="名称"><el-input v-model="dialog.form.name" /></el-form-item>
    <el-form-item label="备注"><el-input v-model="dialog.form.remark" type="textarea" :rows="3" /></el-form-item>
  </el-form>
  <template #footer>
    <el-button @click="dialog.visible = false">取消</el-button>
    <el-button type="primary" @click="onDialogConfirm">确定</el-button>
  </template>
</el-dialog>

<!-- 抽屉 -->
<el-drawer v-model="drawer.visible" :title="drawer.title" direction="rtl" size="420px">
  <div style="padding: 0 16px">{{ drawer.content }}</div>
</el-drawer>
