  历史用途: 搜索表单片段（snippet）
  当前状态: 不再使用。完整可用的「12 项筛选 + 工具栏 + 表格 + 分页」模板见
            templates/pc/list.html。
-->
<el-form :inline="true" :model="query" class="search-form">
  <el-form-item label="关键字"><el-input v-model="query.keyword" placeholder="名称/编号" clearable /></el-form-item>
  <el-form-item label="状态">
    <el-select v-model="query.status" placeholder="全部" clearable>
      <el-option label="启用" value="on" />
      <el-option label="停用" value="off" />
    </el-select>
  </el-form-item>
  <el-form-item label="时间">
    <el-date-picker v-model="query.range" type="daterange" range-separator="至" start-placeholder="开始" end-placeholder="结束" />
  </el-form-item>
  <el-form-item>
    <el-button type="primary" @click="$emit('search')">查询</el-button>
    <el-button @click="$emit('reset')">重置</el-button>
  </el-form-item>
</el-form>
<style>.search-form{background:#fff;padding:12px;border-radius:4px;margin-bottom:12px}</style>
