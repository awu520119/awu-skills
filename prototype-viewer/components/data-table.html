<!-- 参考片段，需要页面提供对应状态与事件；不能直接作为独立页面。
完整页面请使用本技能内置的 templates/pc/list.html、form.html 或 detail.html。
-->
<el-table :data="rows" border stripe>
  <el-table-column type="selection" width="48" />
  <el-table-column type="index" label="#" width="60" />
  <el-table-column prop="name" label="名称" min-width="160" />
  <el-table-column prop="status" label="状态" width="100">
    <template #default="{ row }">
      <el-tag :type="row.status === 'on' ? 'success' : 'info'">{{ row.status === 'on' ? '启用' : '停用' }}</el-tag>
    </template>
  </el-table-column>
  <el-table-column prop="createdAt" label="创建时间" width="180" />
  <el-table-column class-name="row-actions-cell" label="操作" width="220" fixed="right">
    <template #default="{ row }">
      <el-button link type="primary" @click="$emit('view', row)">查看</el-button>
      <el-button link type="primary" @click="$emit('edit', row)">编辑</el-button>
      <el-button link type="danger"  @click="$emit('delete', row)">删除</el-button>
    </template>
  </el-table-column>
</el-table>
