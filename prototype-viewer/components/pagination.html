<!--
  ⚠️ 本文件仅作参考片段，已被 templates/pc/list.html 内联的分页写法取代 ⚠️

  component: pagination.html
  历史用途: 分页器片段（snippet）
  当前状态: 不再使用。不再使用；新页请用 templates/ 下对应模板。

  真正的分页器写法见 templates/pc/list.html 的 .pagination-bar + el-pagination 段。
-->
<el-pagination
  v-model:current-page="page.current"
  v-model:page-size="page.size"
  :total="page.total"
  :page-sizes="[10, 20, 50, 100]"
  layout="total, sizes, prev, pager, next, jumper"
  background
  @size-change="$emit('reload')"
  @current-change="$emit('reload')" />
