<!DOCTYPE html>
<!--
  template: form.html
  用途: PC 表单页模板（100vh 三段固定 + 三分组 + 12 类控件 + 完整校验）

  特性：
  - 布局：page-header（固定）/ form-body（flex:1，独立滚动）/ form-footer（固定）
    → 窗口再矮，底部「提交 / 保存草稿 / 取消」也不会被滚出屏幕
  - 三个分组卡片，覆盖 12 种控件类型：
    · 基本信息：输入框 / 下拉单选 / 下拉多选 / 数字输入 / 日期 / 日期时间
    · 业务信息：弹窗单选(选择公司) / 弹窗多选(选择门店) / 级联选择 / 单选组 / 复选组 / 开关
    · 其他设置：文本域(字数统计) / 文件上传 / 说明 Alert
  - 校验规则覆盖：必填 / 长度上下限 / 数字范围 / 正则(手机号) / 自定义校验函数
  - 两列栅格；备注、上传等长控件跨两列
  - 所有可见文案默认中文（日期 / 弹窗 / 下拉文案由 zh-cn-locale.js 提供）

  使用方式: 拷贝本文件到 pages/<id>.html，再修改：
    - <title>         页面标题
    - pageTitle       页头显示的标题文案
    - initialForm()   表单数据模型（新增字段在这里加一处，重置逻辑自动跟随）
    - rules           校验规则
    - options         各下拉 / 级联的候选项
    - allCompanies / allStores  弹窗选择器源数据
    - onSubmit()      提交逻辑（当前只弹 ElMessage，替换为真实接口调用）

  注意：不要在 <div id="app"> 内部写 {{XXX}} 形式的占位符 —— 那是 Vue 的插值语法，
        会被当作表达式求值并抛 "XXX is not defined"。页面标题改 <title> 与 pageTitle。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="../assets/scaffold-base.css" />
  <link rel="stylesheet" href="../assets/element-plus.css" />
  <script src="../assets/vue.global.prod.js"></script>
  <script src="../assets/element-plus.full.min.js"></script>
  <script src="../assets/icons-vue.iife.min.js"></script>
  <script src="../assets/viewer-bridge.js"></script>
  <!-- 中文语言包：element-plus.full.min.js 只打了英文，不引这个日期/弹窗会显示英文 -->
  <script src="../assets/zh-cn-locale.js"></script>
  <!-- scaffold 通用工具：stamp / registerIcons -->
  <script src="../assets/scaffold-helpers.js"></script>
  <style>
    /* 整页布局：上下竖排；页头与底部操作栏固定，只让表单区滚动 */
    #app {
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 页头：标题 + 右侧次要操作 */
    .page-header {
      background: #fff;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-header .title { font-size: 16px; font-weight: 600; color: #303133; }
    .page-header .sub { font-size: 12px; color: #909399; }
    .page-header .spacer { flex: 1; }
    /* 表单主体：flex:1 占满剩余高度，内部纵向滚动 */
    .form-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;   /* 给滚动条留位，避免内容贴边 */
    }
    /* 分组卡片 */
    .form-card {
      background: #fff;
      border-radius: 4px;
      padding: 16px 20px 4px;
      margin-bottom: 12px;
    }
    .form-card > .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #303133;
      margin: 0 0 16px;
      padding-left: 8px;
      border-left: 3px solid #409eff;
      line-height: 16px;
    }
    /* 两列栅格；.span-2 的表单项跨满两列 */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 24px;
    }
    .form-grid .span-2 { grid-column: 1 / -1; }
    /* 让所有输入型控件撑满各自格子 */
    .form-grid .el-select,
    .form-grid .el-cascader,
    .form-grid .el-date-editor,
    .form-grid .el-input-number { width: 100%; }
    /* 底部操作栏：固定在视口底，不随表单滚动 */
    .form-footer {
      background: #fff;
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-footer .tip { font-size: 12px; color: #909399; }
    .form-footer .spacer { flex: 1; }
    /* 弹窗单选/多选（公司/门店）列表样式 —— 与 list.html 保持完全一致 */
    .picker-trigger { cursor: pointer; }
    .picker-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .picker-toolbar .el-input { flex: 1; }
    .picker-list {
      border: 1px solid #ebeef5;
      border-radius: 4px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .picker-row {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s ease;
    }
    .picker-row:hover { background: #f5f7fa; }
    .picker-row.is-checked { background: #ecf5ff; color: #409eff; }
    /* 上传区提示 */
    .upload-tip { font-size: 12px; color: #909399; line-height: 18px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- el-config-provider 提供中文 locale，覆盖日期 / 弹窗 / 下拉 等组件的默认英文文案 -->
    <el-config-provider :locale="zhCnLocale">

      <!-- 页头：固定 -->
      <div class="page-header">
        <span class="title">{{ pageTitle }}</span>
        <span class="sub">带 * 为必填项</span>
        <span class="spacer"></span>
        <el-button :icon="RefreshLeft" @click="onReset">重置</el-button>
      </div>

      <!-- 表单主体：独立滚动区 -->
      <div class="form-body">
        <el-form ref="formRef" :model="form" :rules="rules" label-width="100px" status-icon>

          <!-- ===== 分组一：基本信息 ===== -->
          <div class="form-card">
            <h3 class="card-title">基本信息</h3>
            <div class="form-grid">
              <el-form-item label="名称" prop="name">
                <el-input v-model="form.name" placeholder="请输入名称" maxlength="40" show-word-limit clearable />
              </el-form-item>
              <el-form-item label="编号" prop="code">
                <el-input v-model="form.code" placeholder="字母 / 数字 / 短横线，4-20 位" maxlength="20" clearable />
              </el-form-item>
              <el-form-item label="类型" prop="type">
                <el-select v-model="form.type" placeholder="请选择类型" clearable>
                  <el-option v-for="o in options.type" :key="o.value" :label="o.label" :value="o.value" />
                </el-select>
              </el-form-item>
              <el-form-item label="业务标签" prop="tags">
                <el-select v-model="form.tags" multiple collapse-tags collapse-tags-tooltip placeholder="可多选" clearable>
                  <el-option v-for="o in options.tag" :key="o.value" :label="o.label" :value="o.value" />
                </el-select>
              </el-form-item>
              <el-form-item label="数量" prop="amount">
                <el-input-number v-model="form.amount" :min="1" :max="9999" :step="1" controls-position="right" />
              </el-form-item>
              <el-form-item label="联系电话" prop="phone">
                <el-input v-model="form.phone" placeholder="11 位手机号" maxlength="11" clearable />
              </el-form-item>
              <el-form-item label="生效日期" prop="effectDate">
                <el-date-picker
                  v-model="form.effectDate"
                  type="date"
                  placeholder="选择日期"
                  value-format="YYYY-MM-DD" />
              </el-form-item>
              <el-form-item label="截止时间" prop="deadline">
                <el-date-picker
                  v-model="form.deadline"
                  type="datetime"
                  placeholder="选择日期时间"
                  value-format="YYYY-MM-DD HH:mm:ss" />
              </el-form-item>
            </div>
          </div>

          <!-- ===== 分组二：业务信息 ===== -->
          <div class="form-card">
            <h3 class="card-title">业务信息</h3>
            <div class="form-grid">
              <!-- 弹窗单选：点击只读输入框 → Dialog 内单选 → 确定回填 -->
              <el-form-item label="所属公司" prop="companyId">
                <el-input
                  v-model="form.companyName"
                  placeholder="点击选择公司"
                  readonly
                  class="picker-trigger"
                  @click="openCompanyDialog">
                  <template #append><el-icon><Search /></el-icon></template>
                </el-input>
              </el-form-item>
              <!-- 弹窗多选：Dialog 内复选组 → 确定回填（逗号分隔） -->
              <el-form-item label="覆盖门店" prop="storeIds">
                <el-input
                  v-model="form.storeNames"
                  placeholder="点击选择门店（可多选）"
                  readonly
                  class="picker-trigger"
                  @click="openStoreDialog">
                  <template #append><el-icon><Search /></el-icon></template>
                </el-input>
              </el-form-item>
              <el-form-item label="所属区域" prop="region">
                <el-cascader
                  v-model="form.region"
                  :options="options.region"
                  :props="{ expandTrigger: 'hover' }"
                  placeholder="请选择省 / 市"
                  clearable />
              </el-form-item>
              <el-form-item label="优先级" prop="priority">
                <el-radio-group v-model="form.priority">
                  <el-radio value="high">高</el-radio>
                  <el-radio value="mid">中</el-radio>
                  <el-radio value="low">低</el-radio>
                </el-radio-group>
              </el-form-item>
              <el-form-item label="通知方式" prop="notify">
                <el-checkbox-group v-model="form.notify">
                  <el-checkbox value="sms">短信</el-checkbox>
                  <el-checkbox value="email">邮件</el-checkbox>
                  <el-checkbox value="app">站内信</el-checkbox>
                </el-checkbox-group>
              </el-form-item>
              <el-form-item label="立即启用" prop="enabled">
                <el-switch v-model="form.enabled" active-text="是" inactive-text="否" inline-prompt />
              </el-form-item>
            </div>
          </div>

          <!-- ===== 分组三：其他设置 ===== -->
          <div class="form-card">
            <h3 class="card-title">其他设置</h3>
            <div class="form-grid">
              <el-form-item label="备注" prop="remark" class="span-2">
                <el-input
                  v-model="form.remark"
                  type="textarea"
                  :rows="3"
                  maxlength="200"
                  show-word-limit
                  placeholder="补充说明，最多 200 字" />
              </el-form-item>
              <el-form-item label="附件" class="span-2">
                <el-upload action="#" :auto-upload="false" :limit="3" multiple>
                  <el-button :icon="UploadFilled">选择文件</el-button>
                  <template #tip>
                    <div class="upload-tip">支持 jpg / png / pdf，单个不超过 10MB，最多 3 个（原型不做真实上传）</div>
                  </template>
                </el-upload>
              </el-form-item>
              <el-form-item class="span-2">
                <el-alert
                  title="提交后进入审核流程，审核期间不可再次编辑。"
                  type="info"
                  :closable="false"
                  show-icon />
              </el-form-item>
            </div>
          </div>

        </el-form>
      </div>

      <!-- 底部操作栏：固定 -->
      <div class="form-footer">
        <span class="tip">最后保存：{{ lastSavedAt || '尚未保存' }}</span>
        <span class="spacer"></span>
        <el-button @click="onCancel">取消</el-button>
        <el-button @click="onSaveDraft">保存草稿</el-button>
        <el-button type="primary" :loading="submitting" @click="onSubmit">提交</el-button>
      </div>

      <!-- 弹窗单选：选择公司 -->
      <el-dialog v-model="companyDialog.visible" title="选择公司" width="560px">
        <div class="picker-toolbar">
          <el-input v-model="companyDialog.keyword" placeholder="搜索公司名称" clearable />
        </div>
        <div class="picker-list">
          <div
            v-for="item in filteredCompanies"
            :key="item.id"
            class="picker-row"
            :class="{ 'is-checked': companyDialog.selected === item.id }"
            @click="pickCompany(item)">
            <el-icon v-if="companyDialog.selected === item.id"><Check /></el-icon>
            <span v-else style="display:inline-block;width:16px"></span>
            <span>{{ item.name }}</span>
          </div>
        </div>
        <template #footer>
          <el-button @click="companyDialog.visible = false">取消</el-button>
          <el-button type="primary" @click="confirmCompany">确定</el-button>
        </template>
      </el-dialog>

      <!-- 弹窗多选：选择门店 -->
      <el-dialog v-model="storeDialog.visible" title="选择门店（可多选）" width="560px">
        <div class="picker-toolbar">
          <el-input v-model="storeDialog.keyword" placeholder="搜索门店名称" clearable />
          <el-button @click="clearStore">清空</el-button>
        </div>
        <div class="picker-list">
          <el-checkbox-group v-model="storeDialog.selected" style="width:100%">
            <div v-for="item in filteredStores" :key="item.id" class="picker-row">
              <el-checkbox :value="item.id">{{ item.name }}</el-checkbox>
            </div>
          </el-checkbox-group>
        </div>
        <template #footer>
          <el-button @click="storeDialog.visible = false">取消</el-button>
          <el-button type="primary" @click="confirmStore">确定</el-button>
        </template>
      </el-dialog>

    </el-config-provider>
  </div>

  <script>
    const { createApp, ref, reactive, computed } = Vue;
    const { RefreshLeft, Search, Check, UploadFilled } = ElementPlusIconsVue;
    const { stamp, registerIcons } = window.ScaffoldHelpers;
    // 中文 locale：由 ../assets/zh-cn-locale.js 提供
    const zhCnLocale = window.ZH_CN_LOCALE;

    const app = createApp({
      setup() {
        /* ========== 页头标题（与 <title> 保持一致即可）========== */
        const pageTitle = ref('表单页');

        /* ========== 选项数据（可替换为真实接口数据）========== */
        const options = {
          type: [
            { label: '类型 A', value: 'A' },
            { label: '类型 B', value: 'B' },
            { label: '类型 C', value: 'C' },
          ],
          tag: [
            { label: '高价值', value: 'high' },
            { label: '新客', value: 'new' },
            { label: '老客', value: 'old' },
            { label: '重点跟进', value: 'focus' },
          ],
          region: [
            {
              value: 'bj', label: '北京市',
              children: [{ value: 'chaoyang', label: '朝阳区' }, { value: 'haidian', label: '海淀区' }],
            },
            {
              value: 'sh', label: '上海市',
              children: [{ value: 'xuhui', label: '徐汇区' }, { value: 'pudong', label: '浦东新区' }],
            },
            {
              value: 'gd', label: '广东省',
              children: [{ value: 'gz', label: '广州市' }, { value: 'sz', label: '深圳市' }],
            },
          ],
        };

        /* ========== 弹窗单选 / 多选的源数据 ==========
           PM 直接在示例页里改这份假数据；批量替换为真实接口数据时整段删掉即可。 */
        const allCompanies = ref([
          { id: 1, name: '阿里巴巴' }, { id: 2, name: '腾讯科技' }, { id: 3, name: '字节跳动' },
          { id: 4, name: '美团' }, { id: 5, name: '京东' }, { id: 6, name: '百度' },
          { id: 7, name: '拼多多' }, { id: 8, name: '网易' }, { id: 9, name: '小米' }, { id: 10, name: '华为' },
        ]);
        const allStores = ref([
          { id: 1, name: '北京朝阳店' }, { id: 2, name: '上海徐汇店' }, { id: 3, name: '广州天河店' },
          { id: 4, name: '深圳福田店' }, { id: 5, name: '杭州西湖店' }, { id: 6, name: '成都春熙店' },
          { id: 7, name: '南京新街口店' }, { id: 8, name: '武汉光谷店' }, { id: 9, name: '西安钟楼店' },
          { id: 10, name: '苏州工业园店' }, { id: 11, name: '天津滨海店' }, { id: 12, name: '重庆解放碑店' },
        ]);

        /* ========== 数据模型 ==========
           用工厂函数而不是字面量：重置时 Object.assign(form, initialForm()) 即可，
           新增字段只需在这里加一处，重置逻辑自动跟随，不会漏字段。 */
        const initialForm = () => ({
          // 基本信息
          name: '',
          code: '',
          type: '',
          tags: [],
          amount: 1,
          phone: '',
          effectDate: '',
          deadline: '',
          // 业务信息
          companyId: null,
          companyName: '',
          storeIds: [],
          storeNames: '',
          region: [],
          priority: 'mid',
          notify: ['sms'],
          enabled: true,
          // 其他设置
          remark: '',
        });
        const form = reactive(initialForm());

        /* ========== 校验规则 ==========
           覆盖：必填 / 长度上下限 / 数字范围 / 正则 / 自定义校验函数 */
        const validateCode = (rule, value, callback) => {
          if (!value) return callback(new Error('请输入编号'));
          if (!/^[A-Za-z0-9-]{4,20}$/.test(value)) {
            return callback(new Error('编号只能包含字母 / 数字 / 短横线，长度 4-20 位'));
          }
          callback();
        };
        const rules = {
          name: [
            { required: true, message: '请输入名称', trigger: 'blur' },
            { min: 2, max: 40, message: '长度需在 2 到 40 个字符之间', trigger: 'blur' },
          ],
          code: [{ required: true, validator: validateCode, trigger: 'blur' }],
          type: [{ required: true, message: '请选择类型', trigger: 'change' }],
          tags: [{ type: 'array', required: true, message: '至少选择一个标签', trigger: 'change' }],
          amount: [{ type: 'number', required: true, min: 1, max: 9999, message: '数量需在 1-9999 之间', trigger: 'blur' }],
          phone: [
            { required: true, message: '请输入联系电话', trigger: 'blur' },
            { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' },
          ],
          effectDate: [{ required: true, message: '请选择生效日期', trigger: 'change' }],
          companyId: [{ required: true, message: '请选择所属公司', trigger: 'change' }],
          region: [{ type: 'array', required: true, message: '请选择所属区域', trigger: 'change' }],
        };

        /* ========== 弹窗单选：公司 ========== */
        const companyDialog = reactive({ visible: false, keyword: '', selected: null });
        const filteredCompanies = computed(() => {
          const kw = companyDialog.keyword.trim().toLowerCase();
          if (!kw) return allCompanies.value;
          return allCompanies.value.filter(c => c.name.toLowerCase().includes(kw));
        });
        const pickCompany = (item) => { companyDialog.selected = item.id; };
        const openCompanyDialog = () => {
          companyDialog.selected = form.companyId;
          companyDialog.keyword = '';
          companyDialog.visible = true;
        };
        const confirmCompany = () => {
          if (companyDialog.selected != null) {
            const c = allCompanies.value.find(x => x.id === companyDialog.selected);
            if (c) {
              form.companyId = c.id;
              form.companyName = c.name;
              // 手动触发校验，让必填态及时消掉（弹窗回填不会自动触发 change）
              formRef.value && formRef.value.validateField('companyId').catch(() => {});
            }
          }
          companyDialog.visible = false;
        };

        /* ========== 弹窗多选：门店 ========== */
        const storeDialog = reactive({ visible: false, keyword: '', selected: [] });
        const filteredStores = computed(() => {
          const kw = storeDialog.keyword.trim().toLowerCase();
          if (!kw) return allStores.value;
          return allStores.value.filter(s => s.name.toLowerCase().includes(kw));
        });
        const clearStore = () => { storeDialog.selected = []; };
        const openStoreDialog = () => {
          storeDialog.selected = [...form.storeIds];
          storeDialog.keyword = '';
          storeDialog.visible = true;
        };
        const confirmStore = () => {
          form.storeIds = [...storeDialog.selected];
          form.storeNames = form.storeIds
            .map(id => allStores.value.find(s => s.id === id)?.name || '')
            .filter(Boolean)
            .join(', ');
          storeDialog.visible = false;
        };

        /* ========== 提交 / 草稿 / 重置 / 取消 ========== */
        const formRef = ref(null);
        const submitting = ref(false);
        const lastSavedAt = ref('');

        const onSubmit = () => {
          formRef.value.validate((valid) => {
            if (!valid) { ElMessage.error('请检查表单必填项'); return; }
            submitting.value = true;
            // 原型演示：真实项目在这里调接口，成功后 gotoNode 回列表页
            setTimeout(() => {
              submitting.value = false;
              lastSavedAt.value = stamp();
              ElMessage.success('提交成功');
            }, 400);
          });
        };

        const onSaveDraft = () => {
          lastSavedAt.value = stamp();
          ElMessage.success('草稿已保存');
        };

        const onReset = () => {
          Object.assign(form, initialForm());
          formRef.value && formRef.value.clearValidate();
          ElMessage.info('表单已重置');
        };

        // gotoNode 的 id 是中性占位符：拷贝到业务页后改成真实的列表页节点 id
        const onCancel = () => ElMessageBox.confirm('放弃当前编辑？未保存的内容会丢失。', '提示', { type: 'warning' })
          .then(() => gotoNode('xxx', () => ElMessage.info('请在查看器中打开以跳转')))
          .catch(() => {});

        return {
          pageTitle, options, form, rules, formRef, submitting, lastSavedAt,
          companyDialog, filteredCompanies, pickCompany, openCompanyDialog, confirmCompany,
          storeDialog, filteredStores, clearStore, openStoreDialog, confirmStore,
          onSubmit, onSaveDraft, onReset, onCancel,
          RefreshLeft, Search, Check, UploadFilled,
          zhCnLocale,
        };
      }
    });
    app.use(ElementPlus);
    registerIcons(app, ['Search', 'Check', 'RefreshLeft', 'UploadFilled'], ElementPlusIconsVue);
    app.mount('#app');
  </script>
</body>
</html>
